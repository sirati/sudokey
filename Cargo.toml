[package]
name = "sudokey"
version = "0.2.0"
edition = "2021"
description = "Minimal SSH-agent-authenticated root command broker over a unix socket"
license = "MIT"

[[bin]]
name = "sudokey"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
sha2 = "0.10"                        # SHA256 key fingerprints for the audit log
getrandom = "0.2"
base64 = "0.22"
# High-level, safe wrappers so this crate contains no `unsafe`:
portable-pty = "0.8"                 # pty alloc + fork/exec, done safely for us
# termios/winsize/euid, SO_PEERCRED, umask, pidfd-based child termination
rustix = { version = "0.38", features = ["termios", "process", "net", "fs"] }
signal-hook = "0.3"                  # clean SIGINT/SIGTERM/SIGHUP/SIGWINCH handling

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# NOTE: deliberately *not* `panic = "abort"`. This is a long-lived daemon that
# handles each connection on its own thread; with `abort` a panic anywhere in
# any connection handler takes the whole broker down, turning a single malformed
# request into a denial of service for every user. Unwinding confines the damage
# to the offending connection.
